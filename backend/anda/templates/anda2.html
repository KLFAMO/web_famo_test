<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda – data viewer (base)</title>

    {% load static %}

    <!-- uPlot CSS -->
    <link rel="stylesheet" href="https://unpkg.com/uplot/dist/uPlot.min.css">

    <!-- Our separate stylesheet -->
    <link rel="stylesheet" href="{% static 'css/anda.css' %}">

    <!-- uPlot JS -->
    <script src="https://unpkg.com/uplot/dist/uPlot.iife.min.js"></script>

    <script>
        let dataPlot = null;

        function getDataArrays() {
            const x_tab = {{ mjd_tab_json|safe }};
            const y_tab = {{ val_tab_json|safe }};
            return { x_tab, y_tab };
        }

        // Ograniczamy liczbę etykiet
        function mjdAxisValues(u, vals) {
            const res = [];
            const maxLabels = Math.max(3, Math.floor(u.width / 80));
            const step = Math.max(1, Math.ceil(vals.length / maxLabels));

            for (let i = 0; i < vals.length; i++) {
                if (i % step === 0) {
                    res.push(vals[i].toFixed(5));
                } else {
                    res.push("");
                }
            }
            return res;
        }

        function createOrUpdatePlot() {
            const { x_tab, y_tab } = getDataArrays();
            const plotElem = document.getElementById('data_plot');

            const opts = {
                title: "Data to plot",
                width: plotElem.clientWidth,
                height: 480,
                scales: {
                    x: { time: false },
                    y: { auto: true }
                },
                axes: [
                    {
                        label: "MJD",
                        values: mjdAxisValues,
                    },
                    {
                        label: "Value"
                    }
                ],
                series: [
                    {}, // X
                    {
                        label: "val",
                        width: 1.5,
                        stroke: "steelblue",
                    }
                ]
            };

            const data = [x_tab, y_tab];

            if (dataPlot) {
                dataPlot.destroy();
                dataPlot = null;
            }

            dataPlot = new uPlot(opts, data, plotElem);

            window.addEventListener('resize', () => {
                if (!dataPlot) return;
                dataPlot.setSize({
                    width: plotElem.clientWidth,
                    height: 480
                });
            });
        }

        function export_data_to_csv() {
            const { x_tab, y_tab } = getDataArrays();

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "mjd,val\n";

            x_tab.forEach((x_value, index) => {
                const y_value = y_tab[index];
                csvContent += `${x_value},${y_value}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "data_export.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        window.addEventListener('DOMContentLoaded', () => {
            createOrUpdatePlot();
        });
    </script>
</head>
<body>
<div class="page-container">
    <h1>Anda – base plot</h1>

    <form id="main_form" method="get">
        <label for="tables_names_select">Select parameter name: </label>
        <select name="table_name" id="tables_names_select">
            {% for table_name in tables_names %}
                <option value="{{table_name}}"
                        {% if last_table_name == table_name %}selected{% endif %}
                >{{table_name}}</option>
            {% endfor %}
        </select>
        <br><br>

        <label for="from_mjd">From MJD: </label>
        <input type="number" id="from_mjd" name="from_mjd"
               step="0.0000001"
               ondblclick="this.value=Math.round({{mjd_now}});"
               value="{{last_from_mjd}}">
        <br><br>

        <label for="to_mjd">To MJD: </label>
        <input type="number" id="to_mjd" name="to_mjd"
               step="0.0000001"
               ondblclick="this.value=Math.round({{mjd_now}});"
               value="{{last_to_mjd}}">

        <br>
        <input type="submit" value="Plot">
    </form>

    <p>MJD Today: {{mjd_now}}</p>

    <div class="plot-container">
        <div class="plot-title">Data plot</div>
        <div id="data_plot"></div>

        <div class="controls-row">
            <input id="btn_export" type="button" value="Export to CSV" onclick="export_data_to_csv()">
        </div>
    </div>

</div>
</body>
</html>
